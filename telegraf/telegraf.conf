[agent]
  metric_buffer_limit = 100000
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = true

# Suscriptor MQTT: lee el JSON del publicador
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["uab/lab5/#"]
  qos = 1
  max_undelivered_messages = 10000
  client_id = "telegraf-lab5"
  persistent_session = true
  data_format = "json"
  name_override = "ambiente"
  tag_keys = ["sensor"]
  json_time_key = "ts"
  json_time_format = "unix_ms"
  json_timezone = "UTC"

# Escritura a InfluxDB 2.x
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
