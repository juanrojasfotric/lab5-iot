apiVersion: 1
datasources:
  - name: InfluxDB
    uid: influx-lab5
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: $INFLUX_ORG
      defaultBucket: $INFLUX_BUCKET
      timeInterval: 10s
    secureJsonData:
      token: $INFLUX_TOKEN
