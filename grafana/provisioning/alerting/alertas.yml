apiVersion: 1

contactPoints:
  - orgId: 1
    name: webhook-evidencias
    receivers:
      - uid: webhook-lab5
        type: webhook
        settings:
          url: http://alert-logger:8080/alert
          httpMethod: POST

policies:
  - orgId: 1
    receiver: webhook-evidencias
    group_by: ["alertname"]
    group_wait: 10s
    group_interval: 1m
    repeat_interval: 1h

groups:
  - orgId: 1
    name: lab5-umbrales
    folder: Lab5
    interval: 1m
    rules:
      - uid: temp-alta-sala1
        title: Temperatura alta sala1
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Temperatura promedio de los últimos 2 min > 30 °C en sala1"
        data:
          - refId: A
            datasourceUid: influx-lab5
            relativeTimeRange: { from: 120, to: 0 }
            model:
              refId: A
              query: |
                from(bucket: "iot")
                  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                  |> filter(fn: (r) => r._measurement == "ambiente" and r._field == "temperature")
                  |> group(columns: ["_field"])
                  |> mean()
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [30] }
